# Reverse proxy for the medical store.
#
# Replace pharmacy.example.in with the public host name, and place the
# Let's Encrypt certificates in /etc/nginx/certs (see docs/DEPLOYMENT.md).

upstream app {
    server app:3000;
    keepalive 32;
}

# Plain HTTP: used for the ACME challenge and to redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name pharmacy.example.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pharmacy.example.in;

    ssl_certificate     /etc/nginx/certs/live/pharmacy.example.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/pharmacy.example.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/webhooks/ {
        # The webhook authenticates the payload with its own signature, so the
        # rate limit is the general one.
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://app;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
